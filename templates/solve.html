<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordGen | Play Online</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Passes the URL payload from Flask to JavaScript!
        window.SHARED_PAYLOAD = "{{ payload | default('') }}";
    </script>
    <script src="/static/solve.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo" style="text-decoration: none;">🧩 WordGen</a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/themes">Themes</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>

    <div class="page-content active" style="display: flex; flex-direction: column; align-items: center; padding-top: 30px;">
        
        <!-- HUD / Stats -->
        <div class="solve-hud">
            <div class="solve-timer" id="timer">00:00</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div style="font-weight: bold; margin-right: 15px; color: #64748b;" id="progress-text">0 / 0</div>
            <button class="hint-btn" onclick="giveHint()">💡 Hint</button>
        </div>

        <div class="solve-layout">
            <!-- Game Grid -->
            <div class="solve-grid-container">
                <div id="solve-grid" class="solve-grid"></div>
                <p style="text-align: center; color: #64748b; margin: 15px 0 0 0; font-size: 14px;">
                    📱 <strong>How to play:</strong> Tap the first letter of a word, then tap the last letter.
                </p>
            </div>

            <!-- Word Bank -->
            <div class="solve-words-container">
                <h3 style="margin-top: 0;">Words to Find</h3>
                <ul id="solve-word-list" class="solve-word-list"></ul>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div class="win-modal" id="win-modal">
        <div class="win-content">
            <h2>🎉 Puzzle Complete!</h2>
            <p>You found all the words in <strong id="final-time" style="color: #10b981;">00:00</strong>.</p>
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 25px;">
                <button onclick="window.location.href='/'" class="alt-btn">Home</button>
                <button onclick="window.location.href='/themes'">Play Another</button>
            </div>
        </div>
    </div>
</body>
</html>
