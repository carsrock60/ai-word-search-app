<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordGen | Word Search Generator</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/static/script.js"></script>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WordGen">
    <meta name="google-site-verification" content="xhHcs5aEQCgbr4KsO4WaSgIF6ZdfLVK5ss3CNeKLSPY" />
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo" style="text-decoration: none;">🧩 WordGen</a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/create">Create</a></li>
            <li><a href="/themes">Themes</a></li>
            <li><a href="/faq">FAQ</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>

    <!-- NEW REDESIGNED HERO -->
    <div id="page-home" class="page-content active" style="padding: 0;">
        <div class="hero-redesign">
            <h1 class="hero-title">🧩 Create Word Searches<br>In Seconds</h1>
            <p class="hero-subtitle">Generate puzzles from any topic.<br>Solve online or print.</p>
            <div class="hero-buttons">
                <button class="primary-btn" onclick="window.location.href='/solve'">Start Creating</button>
                <button class="secondary-btn" onclick="window.location.href='/themes'">Browse Themes</button>
            </div>
        </div>

        <!-- NEW DAILY PUZZLE SECTION -->
        <div class="daily-card-container">
            <div class="daily-card card">
                <div class="daily-header">🌟 Today's Challenge</div>
                <h3 style="margin: 0 0 10px 0; font-size: 24px;">
                    Topic: <span id="daily-theme-name" style="color: #3b82f6;">Loading Today's Challenge...</span>
                </h3>
                <p style="color: #64748b; font-size: 16px;">Difficulty: <strong>Hard (15x15)</strong></p>
                <button id="daily-play-btn" onclick="playDailyPuzzle()" class="play-daily-btn">▶ Play Today's Challenge</button>
            </div>
        </div>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js')
            .then(reg => console.log('Service Worker registered!'))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
    }
    </script>
</body>
</html>
